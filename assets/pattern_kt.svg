<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <style>
      .maze-path {
        fill: none;
        stroke: #ffffff;
        stroke-width: 6.5;
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-miterlimit: 4;
        opacity: 0.052;
      }
      .maze-cyan-accent {
        fill: none;
        stroke: #85cbf5;
        stroke-width: 6.5;
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-miterlimit: 4;
        opacity: 0.025;
      }
    </style>
  </defs>

  <g class="maze-path">
    <!-- Major 45-deg Boundary Grid Lines -->
    <path d="M 0,0 L 200,200 M 200,0 L 0,200" />
    <path d="M 0,100 L 100,0 L 200,100 L 100,200 Z" />

    <!-- Diamond 1: North (Center at 100, 50) - Meander Maze -->
    <path d="M 100,20 L 120,40 L 90,70 L 80,60 L 100,40 L 90,30 L 70,50 L 80,60" />
    <path d="M 100,0 L 100,20 M 120,40 L 140,20 L 120,0" />
    <path d="M 60,40 L 80,20 M 60,40 L 40,20 L 60,0" />
    <path d="M 70,70 L 50,50 L 70,30" />
    <path d="M 130,70 L 150,50 L 130,30" />
    <path d="M 100,60 L 110,70 L 130,50 L 110,30 L 100,40" />

    <!-- Diamond 2: East (Center at 150, 100) - Serpentine Maze -->
    <path d="M 180,100 L 160,120 L 130,90 L 140,80 L 160,100 L 170,90 L 150,70 L 140,80" />
    <path d="M 200,100 L 180,100 M 160,120 L 180,140 L 200,120" />
    <path d="M 160,60 L 180,80 M 160,60 L 180,40 L 200,60" />
    <path d="M 130,70 L 150,50 L 170,70" />
    <path d="M 130,130 L 150,150 L 170,130" />
    <path d="M 140,100 L 130,110 L 150,130 L 170,110 L 160,100" />

    <!-- Diamond 3: South (Center at 100, 150) - Meander Maze -->
    <path d="M 100,180 L 80,160 L 110,130 L 120,140 L 100,160 L 110,170 L 130,150 L 120,140" />
    <path d="M 100,200 L 100,180 M 80,160 L 60,180 L 80,200" />
    <path d="M 140,160 L 120,180 M 140,160 L 160,180 L 140,200" />
    <path d="M 130,130 L 150,150 L 130,170" />
    <path d="M 70,130 L 50,150 L 70,170" />
    <path d="M 100,140 L 90,130 L 70,150 L 90,170 L 100,160" />

    <!-- Diamond 4: West (Center at 50, 100) - Serpentine Maze -->
    <path d="M 20,100 L 40,80 L 70,110 L 60,120 L 40,100 L 30,110 L 50,130 L 60,120" />
    <path d="M 0,100 L 20,100 M 40,80 L 20,60 L 0,80" />
    <path d="M 40,140 L 20,120 M 40,140 L 20,160 L 0,140" />
    <path d="M 70,130 L 50,150 L 30,130" />
    <path d="M 70,70 L 50,50 L 30,70" />
    <path d="M 60,100 L 70,90 L 50,70 L 30,90 L 40,100" />

    <!-- Corners: Seamless Boundary Wraps (Connecting between tiles) -->
    <!-- Top-Left (0, 0) -->
    <path d="M 0,30 L 30,0 M 0,50 L 50,0 M 0,70 L 70,0" />
    <path d="M 20,40 L 40,20 M 10,20 L 20,10" />

    <!-- Top-Right (200, 0) -->
    <path d="M 200,30 L 170,0 M 200,50 L 150,0 M 200,70 L 130,0" />
    <path d="M 180,40 L 160,20 M 190,20 L 180,10" />

    <!-- Bottom-Left (0, 200) -->
    <path d="M 0,170 L 30,200 M 0,150 L 50,200 M 0,130 L 70,200" />
    <path d="M 20,160 L 40,180 M 10,180 L 20,190" />

    <!-- Bottom-Right (200, 200) -->
    <path d="M 200,170 L 170,200 M 200,150 L 150,200 M 200,130 L 130,200" />
    <path d="M 180,160 L 160,180 M 190,180 L 180,190" />
  </g>

  <!-- Subtle Cyan Accent Paths for Depth -->
  <g class="maze-cyan-accent">
    <path d="M 90,100 L 100,90 L 110,100 L 100,110 Z" />
    <path d="M 100,80 L 120,100 L 100,120 L 80,100 Z" />
  </g>
</svg>