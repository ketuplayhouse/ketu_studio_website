<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <style>
      .ribbon-track {
        fill: none;
        stroke: #ffffff;
        stroke-width: 20;
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-miterlimit: 4;
        opacity: 0.042;
      }
      .ribbon-block {
        fill: #ffffff;
        opacity: 0.042;
      }
      .ribbon-accent {
        fill: none;
        stroke: #85cbf5;
        stroke-width: 20;
        stroke-linecap: square;
        stroke-linejoin: miter;
        stroke-miterlimit: 4;
        opacity: 0.015;
      }
    </style>
  </defs>

  <!-- Base Grid: Broad Diagonal Ribbons with 45-Degree Turns -->
  <g class="ribbon-track">
    <!-- Continuous Diagonal Ribbon 1 (Passes through center) -->
    <path d="M -40,80 L 80,-40 M -40,200 L 200,-40 M 40,280 L 280,40 M 160,280 L 280,160" />

    <!-- Meander Fold 1: Top-Left Quadrant -->
    <path d="M 0,120 L 60,60 L 120,120 L 60,180" />
    <path d="M 60,0 L 120,60 L 90,90" />

    <!-- Meander Fold 2: Center-Right Quadrant -->
    <path d="M 120,0 L 180,60 L 120,120 L 180,180 L 240,120" />
    <path d="M 180,120 L 210,90" />

    <!-- Meander Fold 3: Bottom-Left Quadrant -->
    <path d="M 0,240 L 60,180 L 120,240" />
    <path d="M 60,240 L 120,180 L 150,210" />

    <!-- Meander Fold 4: Bottom-Right Quadrant -->
    <path d="M 180,240 L 240,180" />
    <path d="M 240,240 L 180,180 L 210,150" />
  </g>

  <!-- Solid Diamond Accent Block (◆) in center bay -->
  <g class="ribbon-block">
    <polygon points="120,105 135,120 120,135 105,120" />
    <polygon points="0,105 15,120 0,135 -15,120" />
    <polygon points="240,105 255,120 240,135 225,120" />
    <polygon points="120,-15 135,0 120,15 105,0" />
    <polygon points="120,225 135,240 120,255 105,240" />
  </g>
</svg>