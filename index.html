<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KeTu Playhouse - Estudio de Videojuegos Móviles</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="KeTu Playhouse: Estudio indie creador de Keyboard Escape: Speed Up (Google Play) y EGO BALL. Descubre nuestros juegos móviles arcade.">
    <meta name="keywords" content="KeTu Playhouse, Keyboard Escape, EGO BALL, videojuegos moviles, android games, arcade, blade ball, anime game, synthwave">
    <meta name="author" content="KeTu Playhouse">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="KeTu Playhouse - Estudio de Videojuegos Móviles">
    <meta property="og:description" content="Creadores de juegos móviles dinámicos y electrizantes. ¡Prueba Keyboard Escape y descubre EGO BALL!">
    <meta property="og:image" content="assets/banner.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Teko:wght@700&family=Cinzel:wght@700;900&display=swap">

    <!-- Stylesheets & Favicon -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="canonical" href="https://ketuplayhouse.com/">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "KeTu Playhouse",
      "url": "https://ketuplayhouse.com",
      "logo": "https://ketuplayhouse.com/assets/logo.png",
      "sameAs": [
        "https://youtube.com/@ketuplayhouse",
        "https://instagram.com/ketuplayhouse",
        "https://tiktok.com/@ketuplayhouse",
        "https://discord.gg/FvvgfS37GY"
      ]
    }
    </script>

    <!-- Language & Script -->
    <script src="lang.js" defer></script>
</head>
<body class="main-hub-body">
    <!-- ChillyRoom Style Subtle Geometric Dark Pattern Background -->
    <div class="chilly-bg-canvas">
        <div class="chilly-bg-overlay"></div>
        <div class="chilly-spotlight-glow" id="chilly-spotlight"></div>
    </div>

    <!-- Header Navigation (ChillyRoom Style Roof Bar) -->
    <header class="chilly-navbar">
        <nav class="chilly-nav-inner">
            <a href="index.html" class="brand-block">
                <img src="assets/logo.png" alt="KeTu Playhouse Logo" class="brand-logo-img">
                <div class="brand-text-block">
                    <span class="brand-name">KeTu Playhouse</span>
                    <span class="brand-sub" data-i18n="nav-tagline">ESTUDIO DE VIDEOJUEGOS</span>
                </div>
            </a>

            <div class="nav-right-cluster">
                <ul class="nav-menu-links">
                    <li><a href="#" onclick="selectGameIndex(0); return false;" class="active" data-i18n="nav-home">Inicio</a></li>
                    <li><a href="mailto:ketusoporte@gmail.com?subject=Soporte%20KeTu%20Playhouse" data-i18n="nav-support">Soporte</a></li>
                    <li><a href="about.html" data-i18n="nav-about">Sobre Nosotros</a></li>
                </ul>

                <!-- Language Pill Dropdown -->
                <div class="lang-dropdown-pill" id="lang-dropdown-pill">
                    <button class="lang-pill-btn" onclick="toggleLangDropdown(event)" aria-label="Cambiar idioma">
                        <span id="current-lang-text">Español</span>
                        <svg viewBox="0 0 24 24">
                            <path d="M7 10l5 5 5-5z"/>
                        </svg>
                    </button>
                    <div class="lang-dropdown-menu">
                        <button class="lang-menu-item active" onclick="selectLanguage('es')">
                            <span>🇪🇸</span> <span>Español</span>
                        </button>
                        <button class="lang-menu-item" onclick="selectLanguage('en')">
                            <span>🇺🇸</span> <span>English</span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- MAIN STUDIO HUB: EXACT CHILLYROOM 3-CARD SHOWCASE -->
    <main class="chilly-studio-hub">
        <section class="chilly-showcase-section">
            <div class="chilly-slider-row">
                <!-- Left Double Chevron Arrow 《 -->
                <button class="chilly-chevron-arrow prev-arrow" onclick="moveSlide(-1)" aria-label="Anterior">
                    <svg viewBox="0 0 24 24">
                        <path d="M11 6L9.59 7.41 14.17 12l-4.58 4.59L11 18l6-6-6-6z" transform="rotate(180 12 12)"/>
                        <path d="M17 6l-1.41 1.41L20.17 12l-4.58 4.59L17 18l6-6-6-6z" transform="rotate(180 18 12)"/>
                    </svg>
                </button>

                <!-- 3 Horizontal Cards Container -->
                <div class="chilly-cards-track" id="chilly-cards-track">
                    <!-- Card 0: Keyboard Escape: Speed Up -->
                    <div class="chilly-game-card active" id="card-0" onclick="selectGameIndex(0)">
                        <div class="card-media-wrapper">
                            <img src="assets/banner.png" alt="Keyboard Escape Banner Art" class="card-cover-image">
                        </div>
                        <div class="card-title-lockup">
                            <div class="lockup-main-title ke-font">Keyboard Escape</div>
                            <div class="lockup-sub-title" data-i18n="game1-sub">SPEED UP</div>
                        </div>
                    </div>

                    <!-- Card 1: EGO BALL -->
                    <div class="chilly-game-card" id="card-1" onclick="selectGameIndex(1)">
                        <div class="card-media-wrapper">
                            <img src="assets/ego_ball_banner.jpg" alt="EGO BALL Banner Art" class="card-cover-image">
                        </div>
                        <div class="card-title-lockup">
                            <div class="lockup-main-title ego-font">EGO BALL</div>
                            <div class="lockup-sub-title ego-sub" data-i18n="game2-sub">BLADE ARENA PVP</div>
                        </div>
                    </div>

                    <!-- Card 2: Coming Soon / Secret Portal -->
                    <div class="chilly-game-card" id="card-2" onclick="selectGameIndex(2)">
                        <div class="card-media-wrapper">
                            <img src="assets/coming_soon_portal.jpg" alt="Coming Soon Portal" class="card-cover-image portal-img-pulse">
                        </div>
                        <div class="card-title-lockup">
                            <div class="lockup-main-title secret-font" data-i18n="game3-title">Próximamente...</div>
                            <div class="lockup-sub-title secret-sub" data-i18n="game3-sub">PROYECTO SECRETO</div>
                        </div>
                    </div>
                </div>

                <!-- Right Double Chevron Arrow 》 -->
                <button class="chilly-chevron-arrow next-arrow" onclick="moveSlide(1)" aria-label="Siguiente">
                    <svg viewBox="0 0 24 24">
                        <path d="M7 6L5.59 7.41 10.17 12l-4.58 4.59L7 18l6-6-6-6z"/>
                        <path d="M13 6l-1.41 1.41L16.17 12l-4.58 4.59L13 18l6-6-6-6z"/>
                    </svg>
                </button>
            </div>

            <!-- ACTION BUTTONS: DYNAMICALLY POSITIONED EXCLUSIVELY UNDER CENTER CARD -->
            <div class="center-actions-hub" id="center-actions-hub">
                <!-- Injected via lang.js based on active game -->
            </div>
        </section>

        <!-- INSTITUTIONAL STUDIO FOOTER (CHILLYROOM STYLE) -->
        <footer class="chilly-studio-footer">
            <div class="footer-studio-info-row">
                <span class="footer-dev-text" data-i18n="footer-developer">Developer: KeTu Playhouse Inc.</span>
                <span class="footer-separator">|</span>
                <a href="privacy-policy.html" class="footer-legal-link" data-i18n="link-privacy">Política de Privacidad</a>
                <span class="footer-separator">|</span>
                <a href="terms-of-service.html" class="footer-legal-link" data-i18n="link-terms">Términos de Uso</a>
            </div>
            <div class="footer-copyright-text" data-i18n="footer-copy">
                &copy; 2026 KeTu Playhouse Inc. Todos los derechos reservados.
            </div>
        </footer>
    </main>
</body>
</html>
